# 使用远程主题
remote_theme: YoussefRaafatNasry/portfolYOU

# 站点基本信息
title: 你的名字
description: 一句话介绍自己，比如“医学图像处理 & 自动化工具开发者”
url: "https://你的用户名.github.io"   # 改成你的实际地址
baseurl: ""                           # 保持空

# 作者信息
author: 你的名字
avatar: assets/avatar.png             # 头像图片路径（可选，稍后说明）

# 社交链接（显示在侧边栏/底部）
social:
  github: 你的用户名
  email: 你的邮箱
  twitter: 你的用户名
  linkedin: 你的用户名
  bilibili: 你的B站ID   # 如果没有可以删除

# 其他设置（保持默认即可）
...
